[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anonimizador-pdf"
version = "0.1.0"
description = "API para converter PDFs de texto em Markdown com pseudonimos."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pdfplumber==0.11.10",
    "presidio-analyzer==2.2.364",
    "pt-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl#sha256=2561c9a72a938d37141e9694e1a36d25061a44ce7e4f3bad2d3fa3bb836191af",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "spacy==3.8.16",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pypdf==6.20.1",
    "pytest==9.1.1",
    "reportlab==5.0.1",
]

[tool.setuptools.packages.find]
include = ["api*", "services*", "repositories*", "models*", "detectors*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["presidio: integracao local com pt_core_news_lg previamente instalado"]
